[package]
name = "sonicboard"
version = "2.1.0"
description = "SonicBoard: Universal Low-Latency Desktop Soundboard & Virtual Audio Router"
authors = ["SonicBoard Audio Systems"]
edition = "2021"

[lib]
name = "sonicboard_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all", "wav", "mp3", "vorbis", "flac"] }
global-hotkey = "0.6"
rdev = "0.5"
hound = "3.5"
once_cell = "1.20"
parking_lot = "0.12"
uuid = { version = "1.11", features = ["v4", "serde"] }
log = "0.4"
dirs = "5.0"
